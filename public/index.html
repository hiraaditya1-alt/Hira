<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="LegacyOS — sistem operasi kantor keluarga untuk aset, likuiditas, tata kelola, dokumen, dan analitik.">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#0c1017">
  <title>LegacyOS — Family Office Anda</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <noscript>
    <div class="noscript">LegacyOS memerlukan JavaScript agar dapat digunakan.</div>
  </noscript>

  <section id="login" class="login" aria-labelledby="login-title">
    <div class="login-card">
      <div class="seal pulse" id="login-seal" aria-hidden="true">L</div>
      <h1 id="login-title">LegacyOS</h1>
      <p class="eyebrow">Family Office Operating System</p>
      <form id="login-form">
        <label for="login-user">ID anggota / email</label>
        <input id="login-user" type="email" autocomplete="username" placeholder="nama@keluarga.id">
        <label for="login-pass">Kode sandi</label>
        <input id="login-pass" type="password" autocomplete="current-password" value="demo-legacyos">
        <button class="btn gold wide" type="submit">Masuk ke demo</button>
      </form>
      <p class="login-note">Demo lokal — kode sandi apa pun diterima. Jangan masukkan data rahasia pada deployment publik.</p>
    </div>
  </section>

  <div id="app" class="app" hidden>
    <aside id="rail" class="rail">
      <div class="brand">
        <div class="seal small" id="brand-seal" aria-hidden="true">L</div>
        <div>
          <strong>LegacyOS</strong>
          <span id="family-label">Family Office Anda</span>
        </div>
      </div>
      <nav id="nav" aria-label="Navigasi utama"></nav>
      <footer class="rail-footer">
        <span><i class="live-dot"></i> Aplikasi online</span>
        <small>Data finansial tersimpan di browser ini</small>
      </footer>
    </aside>

    <div class="shell">
      <header class="topbar">
        <button id="menu-button" class="icon-button menu-button" type="button" aria-label="Buka menu">☰</button>
        <div class="search-wrap">
          <span aria-hidden="true">⌕</span>
          <input id="global-search" type="search" placeholder="Cari aset atau modul…">
        </div>
        <span id="mode-chip" class="chip warning">DEMO</span>
        <button id="currency-button" class="icon-button currency-button" type="button" title="Ganti mata uang">IDR</button>
        <select id="role-select" aria-label="Peran aktif"></select>
        <button id="notification-button" class="icon-button" type="button" aria-label="Notifikasi">
          ♢<span class="badge">3</span>
        </button>
        <div id="avatar" class="avatar" title="Peran aktif">FC</div>
      </header>
      <div id="read-only-banner" class="read-only-banner" hidden></div>
      <main id="view" class="view" tabindex="-1"></main>
    </div>
  </div>

  <div id="modal-root" class="modal-root" hidden>
    <section id="modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"></section>
  </div>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <div id="print-sheet" class="print-sheet" aria-hidden="true"></div>
</body>
</html>
